name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: webforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          node --version
          npm --version
          google-chrome --version || google-chrome-stable --version || chromium --version || true

      - name: Unit and contract tests
        run: npm test

      - name: Verify schemas and registry contracts
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Audit
        run: npm run audit

      - name: Renderer coverage
        run: npm run renderer:coverage

      - name: Package release gate
        run: npm run release:gate

      - name: Full environment release gate
        run: npm run release:full

  canonical-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup canonical Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7 --ignore-scripts --no-audit --no-fund

      - name: Build canonical webforge-reference artifact
        env:
          WEBFORGE_ALLOW_NETWORK: '1'
          WEBFORGE_GENERATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          WEBFORGE_REPOSITORY: ${{ github.repository }}
          WEBFORGE_SOURCE_SHA: ${{ github.sha }}
        run: npm run artifact:canonical

      - name: Verify bounded artifact outcome
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary=JSON.parse(fs.readFileSync(`generated/canonical/webforge-reference/${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}/artifact-run.summary.json`,'utf8'));
          if(summary.productionDeploymentExecuted!==false) throw new Error('production deployment occurred or is unverified');
          if(!['PASS','BLOCKED'].includes(summary.buildStatus)) throw new Error(`invalid build status: ${summary.buildStatus}`);
          if(summary.buildStatus==='BLOCKED'&&(!Array.isArray(summary.buildBlockers)||summary.buildBlockers.length===0)) throw new Error('blocked build missing explicit blocker evidence');
          if(summary.buildAuth?.secretValueRecorded!==false) throw new Error('secret value evidence invariant failed');
          NODE

      - name: Upload canonical provenance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webforge-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            generated/canonical/webforge-reference/${{ github.run_id }}-${{ github.run_attempt }}/runtime/**
            !generated/canonical/webforge-reference/${{ github.run_id }}-${{ github.run_attempt }}/runtime/node_modules/**
            generated/canonical/webforge-reference/${{ github.run_id }}-${{ github.run_attempt }}/*.receipt.json
            generated/canonical/webforge-reference/${{ github.run_id }}-${{ github.run_attempt }}/artifact-run.summary.json
          include-hidden-files: true
          if-no-files-found: warn
