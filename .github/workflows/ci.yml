name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: webforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          node --version
          npm --version
          google-chrome --version || google-chrome-stable --version || chromium --version || true

      - name: Unit and contract tests
        run: npm test

      - name: Verify schemas and registry contracts
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Audit
        run: npm run audit

      - name: Renderer coverage
        run: npm run renderer:coverage

      - name: Package release gate
        run: npm run release:gate

      - name: Full environment release gate
        run: npm run release:full
