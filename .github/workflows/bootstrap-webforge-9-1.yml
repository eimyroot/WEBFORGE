name: bootstrap-webforge-9-1

on:
  push:
    branches:
      - feat/federated-component-pack-r1
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-webforge-9-1.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/federated-component-pack-r1
          fetch-depth: 0

      - name: Validate bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          test -s .bootstrap/MANIFEST
          for f in \
            .bootstrap/xzpart00 \
            .bootstrap/xzpart01 \
            .bootstrap/xzpart02 \
            .bootstrap/xzpart03 \
            .bootstrap/xzpart04 \
            .bootstrap/xzpart05 \
            .bootstrap/xzpart06 \
            .bootstrap/xzpart06t0 \
            .bootstrap/xzpart06t1 \
            .bootstrap/xzpart07a0 \
            .bootstrap/xzpart07a1 \
            .bootstrap/xzpart07b0 \
            .bootstrap/xzpart07b1 \
            .bootstrap/xzpart08
          do
            test -s "$f"
          done

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/xzpart00 \
            .bootstrap/xzpart01 \
            .bootstrap/xzpart02 \
            .bootstrap/xzpart03 \
            .bootstrap/xzpart04 \
            .bootstrap/xzpart05 \
            .bootstrap/xzpart06 \
            .bootstrap/xzpart06t0 \
            .bootstrap/xzpart06t1 \
            .bootstrap/xzpart07a0 \
            .bootstrap/xzpart07a1 \
            .bootstrap/xzpart07b0 \
            .bootstrap/xzpart07b1 \
            .bootstrap/xzpart08 > /tmp/source.tar.xz.b64
          test "$(wc -c < /tmp/source.tar.xz.b64)" -eq 161852
          base64 -d /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          test "$(wc -c < /tmp/source.tar.xz)" -eq 121388
          echo '922487c02bb1e973b7121e6efb3064dc514ad6c24b7556bfa2552349c9387017  /tmp/source.tar.xz' | sha256sum -c -

      - name: Expand canonical WEBFORGE 9.1 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/source.tar.xz -C .
          node -e "const p=require('./package.json'); if (p.version !== '9.1.0') process.exit(1)"
          test -s src/core/federated-components.mjs
          test -s src/adapters/federated-component-pack.mjs
          test -s src/registries/federated-sources.json
          test -s docs/FEDERATED_COMPONENT_PACK_R1.md
          test -s .github/workflows/ci.yml

      - name: Remove one-time bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-webforge-9-1.yml

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'feat: import WEBFORGE 9.1 federated component pack'
          git push origin HEAD:feat/federated-component-pack-r1
